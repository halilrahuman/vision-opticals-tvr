version: '3.8'

services:
  vision_opticals:
    build: .
    container_name: vision_opticals_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=vision_opticals_prod_secret_change_in_production
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
      # Persistent uploaded image media
      - ./public/uploads:/app/public/uploads
